version: 2

before:
  hooks:
    - go mod tidy

builds:
  # Linux & Mac build
  - id: dibo-nix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: .
    binary: dibo
    ldflags:
      - -s -w
      - -X github.com/anton-fuji/dibo/cmd.version={{.Version}}

  # Windows build
  - id: dibo-windows
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    main: .
    binary: dibo
    ldflags:
      - -s -w
      - -X github.com/anton-fuji/dibo/cmd.version={{.Version}}

archives:
  - id: tarballs
    ids:
      - dibo-nix
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

  - id: windows
    ids:
      - dibo-windows
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Allow a failed release to be rerun after some assets were uploaded.
release:
  replace_existing_artifacts: true
